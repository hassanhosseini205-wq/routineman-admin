name: Apply RoutineMan Admin v40 fixes

on:
  push:
    paths:
      - 'tools/patch_v40.py'
      - '.github/workflows/apply-v40.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v40 patch
        run: python3 tools/patch_v40.py

      - name: JavaScript syntax check
        run: node --check app.js

      - name: Verify requested fixes
        run: |
          grep -F 'let session = null; localStorage.removeItem("rm_admin_session");' app.js
          grep -F 'function uniqueDeviceSessions' app.js
          grep -F 'audit_id:id,id:String(id)' app.js
          grep -F 'factors.filter(x=>x.status!=="verified")' app.js
          grep -F '#mfa-secret.mfa-secret' styles.css
          grep -F './app.js?v=40' index.html
          grep -F './styles.css?v=40' index.html

      - name: Commit patched production files
        run: |
          if git diff --quiet -- app.js styles.css index.html; then
            echo 'No production changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css index.html
          git commit -m 'Fix admin MFA, fresh login, sessions and audit delete [skip ci]'
          git push
