name: Apply RoutineMan Admin v41 audit delete fix

on:
  push:
    paths:
      - 'tools/patch_v41.py'
      - '.github/workflows/apply-v41.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v41 patch
        run: python tools/patch_v41.py
      - name: JavaScript syntax check
        run: node --check app.js
      - name: Verify v41 markers
        run: |
          grep -q 'routine_delete_audit_item' app.js
          grep -q 'app.js?v=41' index.html
          grep -q 'styles.css?v=41' index.html
      - name: Commit updated production files
        run: |
          if git diff --quiet -- app.js index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'Fix single audit deletion via secured RPC [skip ci]'
          git push
